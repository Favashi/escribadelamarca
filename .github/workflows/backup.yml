# Copia de seguridad semanal de la base de datos de Supabase (el plan gratuito no incluye copias descargables).
#
# Secretos del repositorio (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL     Cadena de conexión «Session pooler» (panel de Supabase → Connect), con la contraseña.
#   BACKUP_PASSPHRASE   Frase larga para cifrar la copia. Guárdala en tu gestor de contraseñas: sin ella no se puede restaurar.
#
# La copia se sube CIFRADA como artefacto del workflow (el repositorio es público) y se conserva 90 días.
# Descifrar:  gpg --decrypt backup-AAAA-MM-DD.tar.gz.gpg > backup.tar.gz && tar xzf backup.tar.gz
# Restaurar:  ver docs/DESARROLLO.md → «Copias de seguridad».

name: Copia de seguridad

on:
  schedule:
    - cron: '41 3 * * 0'   # domingos a las 03:41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar secretos
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          test -n "$DB_URL" || { echo "Falta el secreto SUPABASE_DB_URL"; exit 1; }
          test -n "$PASS"   || { echo "Falta el secreto BACKUP_PASSPHRASE"; exit 1; }

      # pg_dump nativo (PostgreSQL 17): sin Docker, así no dependemos de descargar imágenes de ghcr.io
      - name: Instalar cliente de PostgreSQL 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Volcar esquema y datos
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          PG=/usr/lib/postgresql/17/bin
          mkdir backup
          # Todo lo de la app (tablas, políticas RLS, funciones, triggers, permisos y datos)
          $PG/pg_dump "$DB_URL" --format=custom --no-owner --schema=public -f backup/public.dump
          # Cuentas de usuario (necesarias para que las bibliotecas vuelvan a casar con sus dueños)
          $PG/pg_dump "$DB_URL" --data-only --no-owner --table=auth.users --table=auth.identities -f backup/auth_data.sql
          # Historial de migraciones (para que la CLI y la integración sepan qué está aplicado)
          $PG/pg_dump "$DB_URL" --data-only --no-owner --schema=supabase_migrations -f backup/migrations_history.sql
          ls -la backup

      - name: Comprimir y cifrar
        env:
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          NAME="backup-$(date -u +%F)"
          tar czf "$NAME.tar.gz" backup
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASS" --symmetric --cipher-algo AES256 -o "$NAME.tar.gz.gpg" "$NAME.tar.gz"
          rm -rf backup "$NAME.tar.gz"
          echo "NAME=$NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.tar.gz.gpg
          retention-days: 90
          if-no-files-found: error
