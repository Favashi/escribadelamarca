# Publica la web en GitHub Pages en cada push a main.
# Solo se despliegan los ficheros de la app (no data/, scripts/ ni supabase/)
# y la versión de la caché del service worker pasa a ser <APP_VERSION>-<commit>,
# para que las PWA instaladas reciban siempre la última versión.
# Si APP_VERSION (js/version.js) es nueva, crea la etiqueta vX.Y.Z y la GitHub Release
# con las notas de RELEASES.
#
# Requisito: Settings → Pages → Source: "GitHub Actions".

name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar la web
        run: |
          mkdir _site
          cp -r index.html privacidad.html manifest.webmanifest sw.js css js assets _site/
          APP_VERSION=$(node --input-type=module -e "$(cat js/version.js); console.log(APP_VERSION)")
          VERSION="edm-${APP_VERSION}-${GITHUB_SHA::7}"
          sed -i "s/const VERSION = '[^']*';/const VERSION = '${VERSION}';/" _site/sw.js
          grep -q "const VERSION = '${VERSION}';" _site/sw.js || { echo "No se pudo fijar VERSION en sw.js"; exit 1; }
          echo "Versión de caché: ${VERSION}"
          find _site -type f | sort

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Crear GitHub Release si la versión es nueva
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module -e "$(cat js/version.js)
            const r = RELEASES.find((x) => x.version === APP_VERSION);
            if (!r) { console.error('RELEASES no tiene notas para ' + APP_VERSION); process.exit(1); }
            const fs = await import('node:fs');
            fs.writeFileSync('notes.md', r.notes.map((n) => '- ' + n).join('\\n') + '\\n');
            fs.writeFileSync('version.txt', APP_VERSION);"
          V="v$(cat version.txt)"
          if gh release view "$V" >/dev/null 2>&1; then
            echo "La release $V ya existe: nada que hacer."
          else
            gh release create "$V" --target "$GITHUB_SHA" --title "$V" --notes-file notes.md
            echo "Creada la release $V"
          fi

  # Aviso por Telegram si falla la publicación (secretos TELEGRAM_BOT_TOKEN y TELEGRAM_CHAT_ID; sin ellos no hace nada)
  notify-failure:
    needs: [build, deploy, release]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Avisar por Telegram del fallo
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_MONITOR_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          test -n "$TG_TOKEN" -a -n "$TG_CHAT" || { echo "Sin secretos de Telegram: no se avisa"; exit 0; }
          curl -s -o /dev/null --max-time 20 "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TG_CHAT" \
            --data-urlencode "text=🚨 Ha fallado «$WORKFLOW» en Escriba de la Marca." \
            --data-urlencode "reply_markup={\"inline_keyboard\":[[{\"text\":\"Ver el registro\",\"url\":\"$RUN_URL\"}]]}"
